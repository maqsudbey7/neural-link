(function () {

  window.__nlShowErr = show;
  addEventListener("error", e => show((e.message || "error") + (e.filename ? `\n${e.filename.split("/").pop()}:${e.lineno}` : "")));

  setTimeout(() => { if (!window.__nlModuleOk) show("Brauzer juda eski yoki kutubxona yuklanmadi. Chrome yoki yangi Safari (iOS 16.4+) da oching.\nBrowser too old or a library failed to load."); }, 25000);
})();

function saveBlob(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000); }

}
$("share").onclick = async () => { $("share").classList.remove("show"); if (!shareFile) return; try { await navigator.share({ files: [shareFile], title: "Neural Link", text: `NEURAL LINK — ${location.href}` }); } catch {} };

}

  if (!canRecord) return;
  const k = Math.min(1.5, 1280 / Math.max(W, H)), c = document.createElement("canvas"); c.width = Math.round(W * k / 2) * 2; c.height = Math.round(H * k / 2) * 2;
  const g = c.getContext("2d"), stream = c.captureStream(30);
  let dest = null; if (actx) { dest = actx.createMediaStreamDestination(); master.connect(dest); dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr)); }
  const mime = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"].find(m => MediaRecorder.isTypeSupported?.(m)) || "";

//  Menyu, til, kamera
// ============================================================
function renderUi() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = t(el.dataset.i); });
  document.querySelectorAll(".langsw button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  $("tips").innerHTML = t("tips").map(([e, d]) => `<div><i>${e}</i>${d}</div>`).join("");
  $("word").placeholder = t("placeholder");
  if ($("go").disabled) $("go").textContent = t("loading");
  $("skName").textContent = S.skel ? t("on") : t("off"); $("liName").textContent = S.lite ? t("on") : t("off");
  $("actGlyph").textContent = ACT_GLYPH[S.act]; $("rPlay").classList.toggle("on", S.act > 0);
  $("acts").innerHTML = t("acts").map(([g, n, d], i) => `<button class="sh ${i === S.act ? "on" : ""}" data-a="${i}"><i>${g}</i><span>${n}<small>${d}</small></span></button>`).join("");
  document.body.classList.toggle("blackbg", S.black); $("rBg").classList.toggle("on", S.black);

  $("shapes").innerHTML = t("shapes").map((n, i) => `<button class="sh ${i === S.shape ? "on" : ""}" data-s="${i}"><i>${SHAPE_GLYPH[i]}</i>${n}</button>`).join("");
  const tips = { rShape: t("shapeT") + ": " + t("shapes")[S.shape], rColor: t("colorT"), rBg: S.black ? t("bgBlack") : t("bgCam"), rPlay: t("playT") + ": " + t("acts")[S.act][1], rShot: t("shotT"), rRec: t("recT") };
  for (const [id, lbl] of Object.entries(tips)) { $(id).title = lbl; $(id).setAttribute("aria-label", lbl); }
  $("sName").textContent = S.sound ? t("on") : t("off"); $("lName").textContent = lang.toUpperCase();
  tipText = null;
}
function setLang(l) { lang = l; store.set("nl-lang", l); renderUi(); }
const toggleMore = force => { const o = force ?? !$("more").classList.contains("open"); $("more").classList.toggle("open", o); $("rMore").setAttribute("aria-expanded", o); if (o) $("shapes").classList.remove("open"); };

$("shapes").onclick = e => { const b = e.target.closest(".sh"); if (b) { setShape(+b.dataset.s); toggleShapes(false); } };
$("rBg").onclick = () => { S.black = !S.black; store.set("nl-black", S.black ? "1" : "0"); renderUi(); SND.tap(); };
$("rColor").onclick = () => { S.color = (S.color + 1) % PALETTES.length; store.set("nl-color", S.color); applyPalette(); if (wordForm && mode === "form" && form.kind === "word") { wordForm = buildWord(wordForm.label); setMode("form", wordForm); } SND.tap(); };
$("mSkel").onclick = () => { S.skel = !S.skel; store.set("nl-skel", S.skel ? "1" : "0"); renderUi(); SND.tap(); };
function setLite(on) {
  S.lite = on; store.set("nl-lite", on ? "1" : "0"); NA = on ? Math.round(N * 0.45) : N;
  if (renderer) { resize(); if (wordForm && mode === "form" && form.kind === "word") assign(form); }
  renderUi();
}
$("mLite").onclick = () => { setLite(!S.lite); SND.tap(); };
const toggleActs = force => { const o = force ?? !$("acts").classList.contains("open"); $("acts").classList.toggle("open", o); if (o) { toggleMore(false); toggleShapes(false); } };
$("rPlay").onclick = () => { toggleActs(); SND.tap(); };
$("acts").onclick = e => { const b = e.target.closest(".sh"); if (b) { setAct(+b.dataset.a); if (+b.dataset.a) learn("play"); toggleActs(false); } };
$("rShot").onclick = () => { captureRequested = true; };
$("rRec").onclick = () => rec ? stopRec() : startRec();
$("rMore").onclick = () => toggleMore();
$("mSnd").onclick = () => { S.sound = !S.sound; store.set("nl-snd", S.sound ? "1" : "0"); renderUi(); updatePad(); };
$("mLang").onclick = () => setLang(lang === "en" ? "uz" : "en");
$("mCam").onclick = () => switchCamera();
document.querySelectorAll(".langsw button").forEach(b => b.onclick = () => setLang(b.dataset.l));
addEventListener("pointerdown", e => { if (!e.target.closest("#more, #rMore")) toggleMore(false); if (!e.target.closest("#shapes, #rShape")) toggleShapes(false); if (!e.target.closest("#acts, #rPlay")) toggleActs(false);
  // ekranga tegish: pufakni yorish yoki suvga to'lqin
  if (!document.body.classList.contains("running") || e.target.closest("#rail, #more, #shapes, #acts, #bottom, #share, #err")) return;
  for (const b of bubbles) if (Math.hypot(e.clientX - b.x, e.clientY - b.y) < b.r * 1.1) { popBubble(b); return; }
  Object.assign(ptr, { down: true, x: e.clientX, y: e.clientY, px: e.clientX, py: e.clientY, vx: 0, vy: 0, since: performance.now(), charge: 0 });
});
addEventListener("pointermove", e => { if (ptr.down) { ptr.x = e.clientX; ptr.y = e.clientY; for (const b of bubbles) if (!b.dead && Math.hypot(ptr.x - b.x, ptr.y - b.y) < b.r) popBubble(b); } });
const ptrUp = () => { if (!ptr.down) return; ptr.down = false; if (!hands.length && mode === "swarm") release(0, ptr.x, ptr.y, ptr.vx, ptr.vy, Math.min(W, H) * 0.06, ptr.charge, 900); };
addEventListener("pointerup", ptrUp); addEventListener("pointercancel", ptrUp);

$("clear").onclick = () => clearWord(true);
if (!canRecord) $("rRec").hidden = true;

let facing = "user";
async function openCamera() {
  const old = video.srcObject; if (old) old.getTracks().forEach(tr => tr.stop());
  const want = { facingMode: facing, width: { ideal: IS_MOBILE ? 640 : 960 }, height: { ideal: IS_MOBILE ? 480 : 540 } };
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: want }); }
  catch (e) { if (e && e.name === "OverconstrainedError") stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: true }); else throw e; }

}

renderUi();

    st.textContent = t("sModel");

    { const [m, f] = baseMode(); if (m !== "swarm") setMode(m, f, true); }

  } catch (e) {

    st.classList.add("err"); btn.disabled = false; btn.textContent = t("start");
  }
};
